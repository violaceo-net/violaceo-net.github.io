<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>violaceo-net – Progetti</title>
  <meta name="description" content="Elenco dei progetti di violaceo-net. List of violaceo-net projects.">
  <style>
    :root {
      --bg: #fbfaff;
      --surface: #ffffff;
      --text: #1f1b2e;
      --muted: #5f5873;
      --border: #e4e0ef;
      --accent: #6b3fa0;
      --accent-soft: #f1eafb;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #14121b;
        --surface: #1c1926;
        --text: #ece8f6;
        --muted: #a69fba;
        --border: #2e2a3c;
        --accent: #b994ea;
        --accent-soft: #2a2238;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      line-height: 1.6;
    }
    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 56px 20px 40px;
    }
    h1 {
      font-size: clamp(1.7rem, 4vw, 2.2rem);
      margin: 0 0 8px;
      letter-spacing: -0.01em;
    }
    h1 span { color: var(--accent); }
    .lead { color: var(--muted); margin: 0 0 36px; }
    .lead em { font-style: normal; display: block; }
    ul.projects { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
    ul.projects a {
      display: block;
      padding: 18px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      color: inherit;
      text-decoration: none;
      transition: border-color .15s, background .15s;
    }
    ul.projects a:hover, ul.projects a:focus-visible {
      border-color: var(--accent);
      background: var(--accent-soft);
      outline: none;
    }
    .name { font-weight: 600; color: var(--accent); }
    .path { color: var(--muted); font-size: .9rem; margin-left: 6px; }
    .desc { display: block; margin-top: 4px; color: var(--muted); font-size: .95rem; }
    footer {
      max-width: 720px;
      margin: 0 auto;
      padding: 24px 20px 40px;
      color: var(--muted);
      font-size: .85rem;
      border-top: 1px solid var(--border);
    }
  </style>
</head>
<body>
  <main>
    <h1><span>violaceo-net</span> – Progetti</h1>
    <p class="lead">
      Elenco dei progetti personali.
      <em lang="en">List of personal projects.</em>
    </p>

    <ul class="projects">
      <li>
        <a href="yt/">
          <span class="name">Shorts</span><span class="path">/yt/</span>
          <span class="desc">
            Strumento personale per caricare gli short sui miei canali YouTube.<br>
            <span lang="en">Personal tool to upload Shorts to my YouTube channels.</span>
          </span>
        </a>
      </li>
    </ul>
  </main>
  <footer>© violaceo-net</footer>
</body>
</html>
